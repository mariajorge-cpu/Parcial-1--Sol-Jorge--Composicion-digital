   <main>

        </div>

        <!-- INFORMACIÓN -->

        <div class="detalle-info">

            <a href="tienda.html" class="volver-tienda">
                ← Volver a la tienda
            </a>

            <span class="producto-categoria" id="producto-categoria"></span>

            <h1 id="producto-nombre"></h1>

            <p class="detalle-precio" id="producto-precio"></p>

            <p class="detalle-descripcion" id="producto-descripcion"></p>

            <!-- CANTIDAD -->

            <div class="selector-cantidad">

                <label for="cantidad">Cantidad</label>

                <input type="number"
                       id="cantidad"
                       name="cantidad"
                       value="1"
                       min="1">

            </div>

            <button type="button" class="btn-carrito">
                Agregar al carrito
            </button>

        </div>

    </section>
