<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mantenete informado | Luján te recibe</title>

    <link rel="stylesheet" href="../estilos.css">

</head>

<body>

    <!-- HEADER -->

    <header class="header">

        <div class="contenedor header-contenido">

            <a href="../index.html" class="logo">

                <img src="../src/iconos/logo lujan.png"
                     alt="Luján te recibe">

                <span class="logo-texto">
                    LUJÁN<br>
                    TE RECIBE
                </span>

            </a>

            <nav class="navegacion" aria-label="Navegación principal">

                <ul>
                    <li><a href="../index.html">Inicio</a></li>
                    <li><a href="../index.html#agenda">Agenda</a></li>
                    <li><a href="como-llegar.html">Cómo llegar</a></li>
                    <li><a href="servicios.html">Servicios</a></li>
                    <li><a href="conoce-lujan.html">Conocé Luján</a></li>
                </ul>

            </nav>

        </div>

    </header>


    <main>



        <section class="informacion seccion">

            <div class="contenedor informacion-contenido">


                <div class="informacion-presentacion">

                    <h1 class="titulo-seccion">
                        Mantenete informado
                    </h1>

                    <p>
                        Recibí por correo las novedades sobre la visita
                        de León XIV a Luján.       
                    </p>

                    <img
                        src="../src/imagenes/peregrinacion.jpg"
                        alt="imagen de la última peregrinación"
                        class="informacion-imagen">

                </div>


               

                <div class="informacion-tarjeta">

                    <form class="informacion-formulario"
                          action="#"
                          method="post">

           

                        <div class="formulario-campo">

                            <label for="nombre">
                                Nombre y apellido
                            </label>

                            <input
                                type="text"
                                id="nombre"
                                name="nombre"
                                autocomplete="name"
                                required>

                        </div>




                        <div class="formulario-campo">

                            <label for="email">
                                Email
                            </label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                autocomplete="email"
                                required>

                        </div>



                        <fieldset class="formulario-intereses">

                            <legend>
                                ¿Qué información te interesa?
                            </legend>

                            <label>
                                <input type="checkbox"
                                       name="intereses"
                                       value="agenda">

                                Agenda y horarios
                            </label>

                            <label>
                                <input type="checkbox"
                                       name="intereses"
                                       value="transito">

                                Tránsito y accesos
                            </label>

                            <label>
                                <input type="checkbox"
                                       name="intereses"
                                       value="transporte">

                                Transporte
                            </label>

                            <label>
                                <input type="checkbox"
                                       name="intereses"
                                       value="servicios">

                                Servicios en el evento
                            </label>

                            <label>
                                <input type="checkbox"
                                       name="intereses"
                                       value="novedades">

                                Novedades generales
                            </label>

                        </fieldset>



                        <label class="formulario-consentimiento">

                            <input
                                type="checkbox"
                                name="consentimiento"
                                value="si"
                                required>

                            Acepto recibir novedades por mail

                        </label>


            

                        <button type="submit"
                                class="formulario-boton">

                            Suscribirme

                        </button>

                    </form>

                </div>

            </div>

        </section>

    </main>


    <!-- FOOTER -->

    <footer class="footer">

        <div class="contenedor footer-contenido">

            <a href="../index.html" class="footer-logo">

                <img src="../src/iconos/logo lujan.png"
                     alt="Luján te recibe">

                <span class="footer-logo-texto">
                    LUJÁN<br>
                    TE RECIBE
                </span>

            </a>


        

            <p class="footer-frase">
                Fe - Cultura - Encuentro
            </p>


            <div class="footer-redes">

                <p>Seguinos en:</p>

                <div class="redes-iconos">

                    <a href="https://www.instagram.com/municipiodelujan/"
                       target="_blank"
                       rel="noopener noreferrer"
                       aria-label="Instagram">

                        <img src="../src/iconos/icons8-instagram-50.png"
                             alt="">

                    </a>


                    <a href="https://www.facebook.com/share/1DmuMXCCsV/"
                       target="_blank"
                       rel="noopener noreferrer"
                       aria-label="Facebook">

                        <img src="../src/iconos/icons8-facebook-f-50.png"
                             alt="">

                    </a>


                    <a href="https://youtube.com/@prensalujan?si=SlQd7xWI5CJJVTDy"
                       target="_blank"
                       rel="noopener noreferrer"
                       aria-label="YouTube">

                        <img src="../src/iconos/icons8-youtube-play-50.png"
                             alt="">

                    </a>


                    <a href="https://x.com/MuniLujan"
                       target="_blank"
                       rel="noopener noreferrer"
                       aria-label="X">

                        <img src="../src/iconos/icons8-twitterx-50.png"
                             alt="">

                    </a>

                </div>

            </div>

        </div>

    </footer>

</body>
</html>
